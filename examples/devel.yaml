apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: bluefield3-driver
rules:
- apiGroups: ["core.loom.io", "infra.loom.io", "scheduling.loom.io"]
  resources: ["*"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: bluefield3-driver
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: bluefield3-driver
subjects:
- kind: ServiceAccount
  name: default
  namespace: default
---
apiVersion: v1
kind: Service
metadata:
  name: bluefield3-driver
spec:
  selector:
    app: bluefield3-driver
  ports:
  - port: 8080
    targetPort: 8080
---
apiVersion: v1
kind: Pod
metadata:
  name: bluefield3-pod
  labels:
    app: bluefield3-driver
spec:
  restartPolicy: OnFailure
  volumes:
    - name: shared-bin
      emptyDir: {}
  containers:
  - name: bluefield3-driver
    image: bluefield3-driver:local
    imagePullPolicy: Never
    securityContext:
      capabilities:
        add: ["NET_ADMIN"]
    args: [
      "--data-iface=iml0",
      "--oob-addr=172.16.44.81",
      "--device-id=1000",
      ]
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
    env:
    - name: POD_NAME
      valueFrom:
        fieldRef:
          fieldPath: metadata.name
    - name: POD_NAMESPACE
      valueFrom:
        fieldRef:
          fieldPath: metadata.namespace
    volumeMounts:
      - name: shared-bin
        mountPath: /shared/bin
        readOnly: true
  - name: dpl-dev
    image: nvcr.io/nvidia/doca/dpl_dev:1.5.0-doca3.4.0-host
    imagePullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
    command: ["sh", "-c", "cp ~/.local/bin/dpl /shared/bin/dpl && sleep infinity"]
    volumeMounts:
      - name: shared-bin
        mountPath: /shared/bin
