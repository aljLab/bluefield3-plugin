apiVersion: core.loom.io/v1alpha1
kind: Application
metadata:
  name: cli
spec: {}
---
apiVersion: core.loom.io/v1alpha1
kind: Application
metadata:
  name: serv
spec: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cli
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cli
  template:
    metadata:
      labels:
        app: cli
      annotations:
        k8s.v1.cni.cncf.io/networks: |
          [{
            "name": "loom-cni",
            "namespace": "loom-system",
            "cni-args": {
              "app_type":      "application",
              "app_name":      "cli",
              "app_namespace": "default"
            }
          }]
    spec:
      containers:
      - name: cli
        image: alpine:3.20
        command: ["sleep", "infinity"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: serv
spec:
  replicas: 1
  selector:
    matchLabels:
      app: serv
  template:
    metadata:
      labels:
        app: serv
      annotations:
        k8s.v1.cni.cncf.io/networks: |
          [{
            "name": "loom-cni",
            "namespace": "loom-system",
            "cni-args": {
              "app_type":      "application",
              "app_name":      "serv",
              "app_namespace": "default"
            }
          }]
    spec:
      containers:
      - name: serv
        image: nginx:latest
        ports:
        - containerPort: 80
