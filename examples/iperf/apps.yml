            "cni-args": {
              "app_type":      "application",
              "app_name":      "iperf-server1",
              "app_namespace": "default"
            }
          }]
    spec:
      containers:
      - name: iperf-server1
        image: networkstatic/iperf3
        command: ["iperf3", "-s"]