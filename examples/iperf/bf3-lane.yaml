apiVersion: plugins.loom.io/v1alpha1
kind: BlueField3Target
metadata:
  name: bf3-target-lane
spec:
  interfaces:
    - in: "enp94s0f0np0"
      out: "enp5es0f0s5"
    - in: "enp5es0f0s6"
      out: "enp5es0f0s7"
  nodeName: "dtn-04"
  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"
  srv6Config:
    mode: "Proxy"
    proxyConfig:
      proxyStrategy: "LaneBased"
      laneCount: 2
