apiVersion: plugins.loom.io/v1alpha1
kind: BlueField3Target
metadata:
  name: bf3-target-field
spec:
  interfaces:
    - in: "enp94s0f0np0"
      out: "enp5es0f0s5"
  nodeName: "dtn-04"
  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"
  srv6Config:
    mode: "Proxy"
    proxyConfig:
      proxyStrategy: "FieldBased"
      fields:
        - proto: "ipv4"
          field: "SrcAddr"
          match:
            name: "bitmask"
            bitmask: "0xfffffff0"
        - proto: "ipv4"
          field: "DstAddr"
          match:
            name: "bitmask"
            bitmask: "0xfffffff0"
