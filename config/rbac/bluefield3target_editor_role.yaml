# This rule is not used by the project bluefield3-plugin itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the plugins.loom.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: bluefield3-plugin
    app.kubernetes.io/managed-by: kustomize
  name: bluefield3target-editor-role
rules:
- apiGroups:
  - plugins.loom.io
  resources:
  - bluefield3targets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - plugins.loom.io
  resources:
  - bluefield3targets/status
  verbs:
  - get
