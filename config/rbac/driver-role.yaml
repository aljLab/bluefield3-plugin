apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: bf3-target
  name: loom-bf3-driver-role
rules:
- apiGroups:
  - plugins.loom.io
  resources:
  - bluefield3targets
  verbs:
  - get
  - list
- apiGroups:
  - core.loom.io
  resources:
  - networkfunctionconfigs
  - networkfunctions
  - p4targets
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - core.loom.io
  resources:
  - networkfunctionconfigs/status
  - networkfunctions/status
  - p4targets/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
