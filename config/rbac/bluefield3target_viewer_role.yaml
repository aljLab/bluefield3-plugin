# This rule is not used by the project bluefield3-plugin itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to plugins.loom.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: bluefield3-plugin
    app.kubernetes.io/managed-by: kustomize
  name: bluefield3target-viewer-role
rules:
- apiGroups:
  - plugins.loom.io
  resources:
  - bluefield3targets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - plugins.loom.io
  resources:
  - bluefield3targets/status
  verbs:
  - get
