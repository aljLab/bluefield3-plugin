---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - my.domain
  resources:
  - bluefield3targets
  - networkfunctions
  - servicechains
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - my.domain
  resources:
  - bluefield3targets/finalizers
  - networkfunctions/finalizers
  - servicechains/finalizers
  verbs:
  - update
- apiGroups:
  - my.domain
  resources:
  - bluefield3targets/status
  - networkfunctions/status
  - servicechains/status
  verbs:
  - get
  - patch
  - update
